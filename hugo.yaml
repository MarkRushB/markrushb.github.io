baseURL: https://markrushb.github.io/
title: Bullshit Practice
theme: stacknote
languageCode: zh-CN
defaultContentLanguage: zh
timeZone: America/New_York
enableRobotsTXT: true

pagination:
  pagerSize: 10
permalinks:
  articles: /:year/:month/:day/:slug/
taxonomies:
  tag: tags
outputs:
  home: [HTML, RSS, JSON]
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  author: Zsc
  authorInitials: Z
  tagline: 感谢电，网络，计算机。
  description: 感谢电，网络，计算机。
  homeEyebrow: 随笔 · 生活 · 技术
  homeTitle: Bullshit Practice
  homeIntro: 感谢电，网络，计算机。
  aboutIntro: 在这里记录生活、故乡、旅行，以及偶尔出现的技术。
  github: https://github.com/MarkRushB
  mainSection: articles
  authorPage: /about/
  showToc: true
  showTopics: true
  showAbout: true
  showNewsletter: true
  newsletterURL: ""
  minTagPostsToIndex: 1
  themeColor: "#FAFAF7"

menu:
  main:
    - {name: 归档, url: /archives/, weight: 10}
    - {name: 搜索, url: /search/, weight: 20}
    - {name: 标签, url: /tags/, weight: 30}
    - {name: 关于, url: /about/, weight: 40}

related:
  includeNewer: true
  threshold: 40
  toLower: true
  indices:
    - {name: tags, weight: 100}
    - {name: date, weight: 10}
