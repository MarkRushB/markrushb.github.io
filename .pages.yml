media:
  - name: images
    label: 图片
    input: static/images/uploads
    output: /images/uploads
    rename: safe
    categories:
      - image

content:
  - name: articles
    label: 文章
    type: collection
    path: content/articles
    format: yaml-frontmatter
    exclude:
      - _index.md
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      fields:
        - date
        - layout
      sort: date
      order: desc
      search:
        - title
        - body
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        description: 短帖的标题不会在正文页显示，但会用于后台辨识和生成文件名。
      - name: date
        label: 发布时间
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss
      - name: layout
        label: 文章类型
        type: select
        required: false
        description: 留空为普通文章；选择“短帖”后，首页直接展示全文并隐藏标题和阅读时长。
        options:
          placeholder: 普通文章
          values:
            - name: tweet
              label: 短帖
      - name: url
        label: 固定链接
        type: string
        required: false
        description: 通常留空即可；编辑旧文章时请保留已有值。
      - name: icon
        label: 图标标记
        type: string
        required: false
        description: 兼容旧短帖字段，通常无需填写。
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: static/images/uploads
          rename: safe
          switcher: true

  - name: about
    label: 关于页面
    type: file
    path: content/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: static/images/uploads
          rename: safe
          switcher: true
